# All tunable values. Paths are relative to the repo root.
paths:
  ply: ../sinceai2026/data/raw/Equipment Room.ply   # original input, read-only (full, uncorrupted capture)
  xlsx: ../sinceai2026/data/raw/equipment.xlsx      # original input, read-only
  out_dir: out              # override with env VALMET_OUT (e.g. out_baseline)

scene:                    # measured on Equipment Room.ply (histogram peaks + RANSAC floor fit)
  up_direction: "-y"
  floor_y: 1.174          # native y of floor plane (up is -y); tilt < 0.4 deg
  ceiling_y: -0.863
  back_wall_z: -3.758     # wall with the door
  units_to_m: 1.15        # ~1 unit = 1.1-1.2 m (from door height)

load:
  min_opacity: 0.1
  max_scale: 0.3
  crop_floaters: true

segment:
  seed: 0
  voxel: 0.02
  outlier_nb: 20
  outlier_std: 2.0
  normal_knn: 16          # neighbours for normal estimation
  opacity_knn: 4          # original splats averaged for a voxel point's opacity
  plane_normal_dot: 0.8   # structural plane point needs |normal . axis| > this
  known_planes:           # axis-aligned structural planes removed first, kept as assets
    - {name: floor,      label: floor,   axis: 1, value: 1.174,  tol: 0.05}
    - {name: ceiling,    label: ceiling, axis: 1, value: -0.863, tol: 0.05}
    - {name: back_wall,  label: wall,    axis: 2, value: -3.758, tol: 0.05}
    - {name: front_wall, label: wall,    axis: 2, value: 3.137,  tol: 0.05}
    - {name: left_wall,  label: wall,    axis: 0, value: -4.673, tol: 0.05}
    - {name: right_wall, label: wall,    axis: 0, value: 3.732,  tol: 0.05}
  ransac:
    dist: 0.02
    n: 3
    iters: 2000
    min_frac: 0.05        # plane must hold > this fraction of remaining points
    max_planes: 4
    component_eps: 0.06   # keep only connected plane patches
    component_min_frac: 0.02
  dbscan:
    eps: 0.045
    min_points: 6         # 12 dropped 34% of points (sparse pipe network)
  min_cluster_points: 60
  noise_reassign_dist: 0.06   # noise -> nearest cluster only within this distance
  contain_tol: 0.02           # box-in-box tolerance for merging same-class objects
  collinear:                  # re-join pipe pieces broken at junctions
    min_cross_overlap: 0.5    # cross-section overlap / smaller cross-section
    max_gap: 0.15             # gap along the pipe axis
  overhead:                   # clusters above the ceiling plane
    min_points: 60
    min_opacity: 0.3
    margin: 0.15          # filter applies only to clusters entirely this far above the ceiling
  split:
    max_diag: 1.5         # cluster is "oversized" above this bbox diagonal ...
    max_points: 5000      # ... or above this many points
    # direction-class split: pipe runs along x/y/z vs non-linear (fittings, equipment)
    pca_knn: 24           # local PCA neighbourhood (points and normals)
    lin_thresh: 0.5       # point-PCA linearity -> pipe-like
    cyl_thresh: 0.25      # normal-scatter cylindricity -> pipe-like
    axis_align: 0.85      # |axis component| needed to count as x/y/z aligned
    smooth_knn: 20        # majority vote over neighbours to remove speckle
    class_eps: 0.045
    class_min_points: 6
    min_part_points: 40
    fitting_max_diag: 0.6 # non-linear part this small -> "fitting/valve"
  pipe_linearity: 0.9

plots:
  dpi: 160
  point_size: 0.3
  max_points: 200000
  noise_color: [0.45, 0.0, 0.0]
  structure_color: [0.75, 0.75, 0.75]

label:
  batch_size: 12            # objects per vision call
  workers: 1                # one request at a time (paid; budget in copilot.budget)
  max_batches: 1            # per run; null = all (only after the pilot justifies it)
  vision_sources: [featherless_vision, gemini_vision]   # label_source values that count as VLM evidence
  manual_sources: [manual_review]       # reviewer-confirmed component CLASS (never asset identity)
  manual_class_vocab:                   # correction-tool class -> label vocab
    pump: pump
    motor: motor
    control valve: control valve
    sensor: pressure transmitter/gauge
    vessel: tank/vessel
    pipe run: pipe segment
  manual_label_overrides:               # per component id, reviewer decision (blue electric actuators = control valves)
    MC-0006: control valve
    MC-0007: control valve
    MC-0008: manual valve/handwheel
  min_conf: 0.45            # below this -> geometry-rule label (Gemini guess kept as label_vlm)
  rules_conf: 0.4
  member_dist: 0.03         # full-res splat point -> object if within this of a segmented point
  panel_px: 320             # saved crop panel size
  send_px: 224              # panel size sent to the VLM
  splat_px: 2               # point radius in px
  context_margin: 0.6
  context_depth: 0.5        # context panel shows only points within this depth of the object
  background: [235, 235, 235]
  thumb_px: 128
  sheet_cols: 16
  vocab: [pump, motor, control valve, manual valve/handwheel, pressure transmitter/gauge, vibration sensor,
          pipe segment, pipe fitting/flange, tank/vessel, electrical cabinet, cable tray, ladder/stairs,
          cage/rack, handrail/railing, door, sign, box/crate, trolley, light fixture, duct, wall, floor, other]

navgrid:
  cell: 0.05
  pad_cells: 2
  floor_dilate: 2
  floor_fill: observed    # observed = spec (floor visible everywhere in Equipment Room) | footprint = assume floor under scan
  footprint_close: 4      # closing iterations for the footprint fill
  obstacle_min_h: 0.10
  obstacle_max_h: 1.80
  obstacle_min_points: 2  # points per cell to count as obstacle (ignores lone floaters)
  avatar_radius: 0.25
  start: [0.0, -3.3]      # [x, z] just inside the door in the back wall; null = auto
  auto_start: max_x       # max_x = right end of the strip | min_x | min_z (doorway)
  resample: 0.05
  target:                 # object the faulty asset (P-002) will be placed on
    point: [-3.1125, 1.1133, -1.8211]   # scene coordinate of the floor pump seen in the first scan (baseline OBJ-0269)
    point_tol: 0.15       # object box must be within this of the point
    object_id: null       # OBJ ids shift between segmentation versions; prefer `point`
    prefer_labels: [pump] # if label.py found reachable objects with these labels, pick among them
    prefer_min_conf: 0.8  # only confidently labelled pumps
    label_reach: 1.2      # approach distance allowed for labelled targets (equipment sits in crowded corners)
    min_points: 150
    max_height_bottom: 0.3
    max_extent: 1.2
    reach: 0.6            # approach cell must be within this of the object's box

mapping:
  seed: 42
  vision_min_conf: 0.6            # VLM class label must be at least this confident to count as label_match
  verified_identities: []         # user-confirmed real-scene identities, e.g.
  #  - {tag: P-002, point: [x, y, z], method: "readable nameplate", confirmed_by: "...", date: "..."}
  target_tag: P-002
  target_asset_id: ASSET-014
  confidence:
    label_match: [0.8, 0.9]       # VLM label agrees with asset class
    geometry_rule: [0.55, 0.7]    # segment hint / shape rule only (no VLM yet)
    random_fallback: [0.3, 0.5]
    forced_demo_target: 0.5       # P-002 placed on the navigation target object
  near_path_pool: 0.5             # random picks come from the nearest half of candidates
  near_path_tags: [P-005, M-006, CV-003, VS-002]   # degraded/attention assets placed right by the path
  class_order: [PROCESS_PUMP, ELECTRIC_MOTOR, CONTROL_VALVE, PRESSURE_TRANSMITTER, VIBRATION_SENSOR]
  sensor_classes: [VIBRATION_SENSOR]
  sensor_hosts: [PROCESS_PUMP, ELECTRIC_MOTOR]
  class_rules:
    PROCESS_PUMP:         {labels: [pump], geometry: equipment}
    ELECTRIC_MOTOR:       {labels: [motor], geometry: equipment}
    CONTROL_VALVE:        {labels: [control valve], geometry: valve}
    PRESSURE_TRANSMITTER: {labels: [pressure transmitter/gauge, gauge], geometry: small}
    VIBRATION_SENSOR:     {labels: [vibration sensor], geometry: small}
  geometry:
    equipment: {max_height_bottom: 0.4, min_points: 100, max_extent: 1.2}
    valve:     {max_diag: 0.6}
    small:     {max_diag: 0.35, min_points: 40}

viewer:
  port: 8080
  proximity_radius: 1.6     # distance avatar -> object box (x-z)
  walk_speed: 0.5           # units/s (path is ~4.3 units -> ~9 s walk)
  fps: 20
  render_splats: true       # false = plain point cloud (faster on weak GPUs)
  point_size: 0.01
  box_thickness: 1.0        # screen px, all frames
  highlight_thickness: 3.5  # screen px, frames near the avatar
  path_lift: 0.02
  use_tour: true            # walk out/tour.json (door -> warning assets -> target) if it exists
  stop_box_thickness: 7.0   # frame around the equipment while the worker stops there (screen px)
  stop_fill_opacity: 0.25   # translucent fill of the stopped-at equipment
  stop_fill_pad: 0.03       # fill box slightly larger than the object box (units)
  stop_blink_hz: 1.5        # blink rate while pausing
  stop_label_scale: 1.2     # big status label above the equipment
  display:                  # splat display: groups can be hidden in the viewer ("Scene display" panel)
    show_ceiling: true
    show_walls: true
    ceiling_cut_h: 1.85     # splats higher than this above the floor = "ceiling" group (units; ceiling at ~2.04)
    wall_band: 0.15         # splats this close to a wall plane = "walls" group
    crop_outside_walls: true  # drop floaters outside the room
    crop_margin: 0.15
    dark_threshold: 0.0     # hide splats darker than this (0 = keep all, as originally; ~0.04 removes most dark haze)
  label_mode: Equipment    # Equipment (mapped + non-pipe objects) | All objects | Nearby only | Off
  equipment_label_scale: 0.8  # font scale for equipment labels
  all_label_scale: 0.55     # font scale for pipe/fitting labels in "All objects"
  other_label_scale: 0.75   # font scale for nearby objects without asset record
  near_label_skip: [pipe segment, pipe fitting/flange, other, wall]   # too many to label while walking
  pick_radius: 0.03         # click ray tolerance (units) ...
  pick_radius_per_unit: 0.01  # ... growing with distance
  selected_color: [255, 0, 255]
  selected_thickness: 5.0
  fly_min_dist: 1.0
  fly_dist_factor: 2.0
  fly_height: 0.3
  path_color: [220, 20, 60]
  avatar:                   # articulated worker; lengths below are for scale 1.0 (~1.73 m at 1 u = 1.15 m)
    scale: 1.0                    # overall size multiplier (1.0 = values below as written)
    hip_h: 0.72
    hip_dx: 0.08
    leg: [0.11, 0.70, 0.13]       # box dims x, length, z
    torso: [0.27, 0.50, 0.18]     # narrowed to match 0.40 m shoulders
    torso_h: 0.98                 # torso centre
    shoulder_h: 1.20
    shoulder_dx: 0.174            # 2 x 0.174 u x 1.15 = 0.40 m shoulder width
    arm: [0.08, 0.52, 0.09]
    head_h: 1.34
    head_r: 0.09
    stride: 0.81                  # distance per full walk cycle (units)
    leg_swing: 0.45               # rad
    arm_swing: 0.35               # rad
    bob: 0.025
    ring_color: [30, 144, 255]
    colors:
      vest: [255, 120, 0]         # hi-vis orange
      trousers: [35, 45, 80]
      boots: [30, 30, 30]
      skin: [225, 180, 140]
      helmet: [255, 210, 0]
  colors:                   # faint frames by condition
    healthy: [150, 150, 150]
    watch: [230, 180, 40]
    degraded: [240, 120, 30]
    attention_required: [220, 30, 30]
    no_record: [205, 205, 215]
  highlight_colors:         # bright frames near the avatar
    healthy: [60, 220, 90]
    watch: [255, 200, 0]
    degraded: [255, 120, 0]
    attention_required: [255, 0, 0]
    no_record: [0, 220, 255]
  voice:                    # spoken briefing on arrival (ElevenLabs TTS over the validated diagnosis)
    enabled: true
    api_key_env: ELEVENLABS_API_KEY
    voice_id: JBFqnCBsd6RMkjVDRZzb     # premade "George"; any ElevenLabs voice ID works
    model_id: eleven_multilingual_v2
    output_format: mp3_44100_128
    timeout_s: 30
    max_checks: 3                      # next safe checks read aloud
    safety_line: "Site procedures, lockout-tagout and permits apply."
    arrive_gap: 0.6                    # worker counts as "in front of" the target within this box gap (units)
  pov:                      # "Worker view (POV)": camera at the worker's eyes (height = avatar head_h)
    fov_deg: 75             # human-like field of view
    eye_forward: 0.12       # eye sits this far in front of the head centre (units), so the head doesn't block it
    look_ahead: 2.0         # while walking, look at a point this far ahead ...
    look_down: 0.35         # ... and this much lower (units): eyes on the floor ahead, like a person walking
    smoothing: 0.2          # 0..1 per frame (20 fps): lower = slower, smoother head turns
    max_look_down_deg: 20   # at a stop the head turns to the equipment but tilts at most this far down ...
    max_look_up_deg: 25     # ... or up (box centres of floor pumps / overhead valves are near floor / ceiling)

evidence:
  samples_per_day: 48           # 30-min telemetry
  metrics: [process_pressure_bar, process_flow_pct, position_setpoint_pct, position_actual_pct,
            pneumatic_supply_bar, stiction_index, load_for_opening_pct, vibration_mm_s,
            bearing_temp_c, motor_current_a, speed_rpm, signal_quality_pct, sensor_bias]
  n_issue_events: 10            # most recent events with the asset's issue code
  n_other_events: 5             # most recent other high-severity events
  important_severities: [high, critical]
  n_work_orders: 5
  n_cases: 3
  always_docs: [DOC-RAG-GUIDE, DOC-FIELD-SAFETY, DOC-3D-MAPPING]
  dq_penalty: {low: 0.02, medium: 0.05, high: 0.1}   # per Data_Quality issue (Builder Q-06)
  dq_penalty_max: 0.3

copilot:
  provider: featherless          # OpenAI-compatible; Gemini removed
  base_url: https://api.featherless.ai/v1
  api_key_env: FEATHERLESS_API_KEY
  model: Qwen/Qwen3.5-397B-A17B  # verified via /v1/models: image_input=true, available_on_current_plan=true
  pricing_usd_per_mtok: {input: 0.55, output: 3.5}   # from /v1/models (image: 0) - for the usage ledger
  temperature: 0.2
  max_tokens: 2000
  disable_thinking: true         # chat_template_kwargs.enable_thinking=false (bounded output)
  timeout_s: 180
  offline: false                 # true (or env VALMET_OFFLINE=1) = caches/templates only, no requests
  budget:
    max_paid_requests: 15        # hard cap over the repo's lifetime (ledger). Pilot 3 -> 10 (expansion) -> 15:
                                 # 5 proposals on EWA renders (RV-01/02/04/06 + hold-out RV-10), justified by
                                 # the disc->EWA rendering difference (disc-era RV-06 proposals were false positives)
    ledger: llm_ledger.jsonl
  expected_latency_s: 25         # drives the viewer's progress bar

repair:                     # boundary repair over baseline leaves (pipeline/repair.py); provisional values,
  min_object_points: 20     # to be re-tuned only against reviewed examples (review/regions.yaml)
  geometry:                 # pipe continuity: all must hold; box overlap is never used
    min_points: 30
    max_angle_deg: 8        # fitted axes
    offset_frac: 0.9        # lateral centreline offset (partial surfaces shift centroids) <= offset_frac * half-width + offset_abs
    offset_abs: 0.015
    max_thickness_ratio: 1.6
    max_gap: 0.15           # axial gap
    barrier_points: 12      # >= this many compact non-pipe points in the gap -> valve/fitting/branch: no join
    barrier_max_diag: 0.6   # non-pipe leaf counts as a barrier only if valve/fitting sized
    run_fit_frac: 1.3       # whole joined run: 90th pct lateral residual <= this * half-width + offset_abs
  context:                  # proposal + SAM mask + visible support
    min_in_px: 30           # visible pixels inside masks (all views) before an object is considered
    member_frac: 0.6        # object visible-in-mask share to merge it whole
    set: ewa-ewa            # association set building out/: <SAM/visibility renderer>-<proposal source>
                            # (others -> out_ctx_<set>/); regions without a proposal of that source get no repair
    min_split_voxels: 15
    seen_eps: 0.02          # summed visibility weight below this = voxel unobserved by this candidate's views
    min_coverage: 0.5       # whole-group claim needs this share of the group's voxels observed ...
    spatial_frac: 0.8       # ... and this share within spatial_dist of a supported voxel
    spatial_dist: 0.05
    corroborate_overlap: 0.3  # same-class claims sharing this share of the smaller claim = one component, united
    claim_margin: 0.2       # competing claims: winner must beat runner-up support by this, else ambiguous
    provisional_frac: 0.1   # candidate losing/ambiguous on more than this share of its claim -> provisional
    min_candidate_voxels: 25
    cc_eps: 0.05
    cc_min_frac: 0.2
    pipe_protect_min_len: 0.4   # pipe groups at least this long are never merged into / split by context repair
    max_extent: 1.2         # pump/motor/valve larger than this (units) = implausible join
    disabled: []            # revert individual repairs, e.g. [RV-06/C1]; rebuild with python -m pipeline.repair

propose:                    # contextual proposals (pipeline/propose.py)
  seg_dir: out_geo          # segmentation shown in the fragment-ID overlay and used for association
  renderer: ewa             # disc (baseline) | ewa (alpha-composited anisotropic Gaussians)
  proposal_source: ewa      # legacy = pilot proposals (disc images, bound by key + cameras) | ewa | disc
  render:
    disc: {}
    ewa: {r_max: 64, dilation: 0.3, w_min: 0.004}
  sam_model: facebook/sam2.1-hiera-tiny
  min_sam_score: 0.5
  box_expand: 0.2          # each side, fraction of the VLM box size (raw box still drawn)
  min_confidence: 0.5       # VLM confidence to use a candidate for repair
  depth_gate_min: 0.15      # mask pixels deeper than front + max(min, size_factor * size) are background
  depth_gate_size: 1.2

correct:                    # guided manual boundary correction (pipeline/correct.py, api/annotate.py)
  base_seg: out             # segmentation version being corrected (never modified)
  out_seg: out_manual       # separate version, written only by the explicit Apply action
  store: review/corrections # reviewer prompts, masks, revisions, undo history
  renderer: ewa             # calibrated renders + contribution weights used for 2D->3D support
  port: 8091                # correction page (embedded in the viewer; standalone: python -m api.annotate)
  viser_port: 8081          # standalone 3D preview only
  classes: [unknown, pump, motor, valve, control valve, sensor, vessel, pipe run, other]
  two_view_min_agree: 0.3   # share of the selection inside the mask in >= 2 views ...
  max_disagreement: 0.15    # ... and disputed share at most this -> "two-view" evidence
  guide_max_points: 6000
  rank_depth_tol: 0.05
  uncertain_radius: 0.08    # unseen points of touched objects this close to the selection are reported uncertain

tour:                       # inspection tour: door -> warning assets (from Excel status) -> faulty target
  stops: []                 # manual route: tags in visiting order, e.g. [CV-003, M-006]; [] = automatic from Excel
  conditions: [attention_required, degraded]   # which Current_State conditions become stops, most urgent first
  max_stops: 5              # keeps the walk a sensible length for the demo
  reach: 1.6                # stop is reachable if walkable floor is within this of its box (1.6 includes M-006 in its corner)
  pause_s: 2.0              # viewer pause at each stop

chat:                       # viewer chat: quick commands (free) -> Claude Code headless + our MCP server
  quick_commands: true      # handle "take me to M-006", "show P-005", "start tour", ... locally, instantly
  claude_path: auto         # auto = `claude` on PATH or the binary bundled with the Claude Code editor extension
  model: null               # null = your Claude Code default
  timeout_s: 150
  system_prompt: >-
    You are the field-service copilot inside a 3D viewer of an industrial equipment room. Answer in at most
    8 short lines of markdown. Use the valmet-copilot tools; ground statements in tool results and cite
    evidence IDs (TEL-, EVT-, WO-, CASE-, DOC-, DQ-). If the user wants to see, find, go to or tour
    something, call show_in_viewer, walk_in_viewer or tour_in_viewer. Use diagnose with allow_paid=false
    unless the user explicitly asks for a fresh paid diagnosis. Never recommend autonomous physical action;
    recommend verification and escalation (site procedures, LOTO, permits apply).
