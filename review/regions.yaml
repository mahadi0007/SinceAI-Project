# refs (v2, FROZEN 2026-11-07): set on EWA Gaussian renders (pipeline/review_refs.py: reviewer pixel box ->
# median-depth unprojection -> front-surface AABB, extended along the view direction because the back side is
# unseen). v2 replaces v1 after better renders showed v1 CLASS errors (RV-01: red circulator pumps were called
# valves, blue valve actuators were called pumps) and loose boxes. v1 boxes are kept as refs_v1 for history.
# APPROXIMATE boxes, not pixel-accurate ground truth; NOT derived from workbook anchors.
# RV-10 is an untouched hold-out: references set before any proposal/repair ran there; never used for tuning.
# Freeze hash (sha256 of the refs blocks) is printed by `python -m pipeline.evaluate --freeze-check`.
# Ontology: pump, motor, valve (body + handwheel/actuator), pipe run, sensor, vessel, structure, unknown.
