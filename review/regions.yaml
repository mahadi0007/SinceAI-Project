# Fixed review regions and reviewed reference components (native coordinates, up = -y).
#
# References were set by visual review of calibrated renders (out_review/closeups/*.png,
# 2026-11-07) of the baseline segmentation. They are APPROXIMATE axis-aligned 3D boxes around
# the visible component, NOT pixel-accurate ground truth and NOT derived from workbook anchors.
# Ontology (component class): pump, motor, valve (body + handwheel/actuator), pipe run, sensor,
# vessel, structure, unknown. Assembly membership and asset identity are kept separate.
#
# Views: calibrated pinhole cameras (eye -> target, fov deg) used for proposals, SAM and visibility.

regions:
  - id: RV-01
    name: back-right wall, two inline circulator pumps + handwheel valve
    views:
      - {eye: [2.40, 0.15, -2.20], target: [2.40, 0.25, -3.45], fov: 60}
      - {eye: [1.40, 0.00, -2.50], target: [2.40, 0.25, -3.45], fov: 55}
    refs:
      - {id: RC-01, cls: pump, note: "circulator pump A (grey motor head) inline on vertical pipe",
         box: [[2.64, 0.39, -3.51], [2.82, 0.57, -3.21]]}
      - {id: RC-02, cls: pump, note: "circulator pump B, head split across baseline 638/395",
         box: [[2.08, 0.37, -3.51], [2.26, 0.58, -3.16]]}
